name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile all modules
        # py_compile only parses/compiles (no imports), so no third-party deps
        # are needed — this catches syntax errors across the whole app on push.
        run: python -m compileall -q .

  store-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest "psycopg[binary]>=3.1"

      - name: Store tests — SQLite backend
        run: python -m pytest -q tests/

      - name: Store tests — PostgreSQL backend
        env:
          LZ_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lz_test
        run: python -m pytest -q tests/
